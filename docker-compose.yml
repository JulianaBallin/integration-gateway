services:
  gateway-api:
    build: ./gateway-api
    networks:
      - external_net
      - internal_net
  transformer:
    build: ./transformer
    networks:
      - internal_api
      - data_net

  internal-api-mock:
    build: ./internal-api-mock
    networks:
      - internal_net

   postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  audit-api:
    networks:
      - external_net
      - internal_net
      - data_net

networks:
  - external_net #	gateway-api, audit-api  	                     |   Acesso externo controlado
  - internal_net #	gateway-api, transformer, internal-api-mock	   |   Integração interna entre serviços
  - data_net     #  transformer, audit-api, postgres	             |   Persistência e auditoria